<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html</title>
</head>

<body>

    <h2>Job Application</h2>

    <label for="name">Name:</label> <br>
    <input type="text" name="name" id="name">
    <br><br>
    <label for="email">Email:</label> <br>
    <input type="email" name="email" id="email">
    <br><br>
    <label for="phone">Phone:</label> <br>
    <input type="tel" name="phone" id="phone">
    <br><br>
    <label for="resume">Resume:</label> <br>
    <input type="file" name="resume" id="resume">
    <br><br>
    <label for="experience">Experience:</label> <br>
    <select name="experience" id="experience">
        <option value="fresher">fresher</option>
        <option value="1_year">1 year</option>
        <option value="2_years">2 years</option>
        <option value="3_years">3 years</option>
        <option value="4_years">4 years</option>
        <option value="5_+_years">5 + years</option>
    </select>
    <br><br>
    <fieldset>
        <legend>Skills</legend>
        <label for="HTML">HTML</label>
        <input type="checkbox" name="HTML" id="HTML">
        <br><br>
        <label for="CSS">CSS</label>
        <input type="checkbox" name="CSS" id="CSS">
        <br><br>
        <label for="JAVA_SCRIPT">JAVA SCRIPT</label>
        <input type="checkbox" name="JAVA_SCRIPT" id="JAVA_SCRIPT">
    </fieldset>
    <br><br>
    <label for="highest_education">Higest Education:</label> <br>
    <select name="highest_education" id="highest_education">
        <option value="high_school">High school</option>
        <option value="intermideate">Intermideate</option>
        <option value="graduate">Gradguate</option>
        <option value="masters">Masters</option>
    </select>
    <br><br>
    <label for="availability">Availability</label><br>
    <label for="Full_time">Full-time</label>
    <input type="radio" name="availability" id="Full_time">
    <br>
    <label for="Part_time">Part-time</label>
    <input type="radio" name="availability" id="Part_time">
    <br><br>
    <label for="comments">Additional Comments:</label> <br>
    <textarea name="comments" id="comments" rows="10" cols="30"></textarea>
    <br><br>
    <button type="submit">Submit</button>
</body>

</html>
